<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFinance - Your AI Financial Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --light-gray: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            background: white;
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--secondary);
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(180deg);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 16px 0;
            margin-bottom: 24px;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: var(--light-gray);
            color: var(--dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .ai-message .message-header {
            color: var(--primary);
        }

        .user-message .message-header {
            color: white;
            opacity: 0.9;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 16px;
            background: var(--light);
            border-radius: 16px;
            border: 2px solid var(--light-gray);
            transition: border-color 0.3s ease;
        }

        .input-area:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 12px 0;
            resize: none;
            max-height: 120px;
            min-height: 24px;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--light);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--light-gray);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--gray);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                height: 95vh;
                border-radius: 16px;
            }

            .header {
                padding: 20px 24px;
            }

            .logo-text {
                font-size: 24px;
            }

            .chat-container {
                padding: 20px;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .logo {
                justify-content: center;
            }

            .message {
                max-width: 90%;
            }
        }

        /* Welcome message styling */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }

        .welcome-message h2 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--dark);
        }

        .welcome-message p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .feature {
            background: var(--light);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--light-gray);
            text-align: center;
            min-width: 140px;
        }

        .feature i {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .feature span {
            font-size: 14px;
            color: var(--dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">VF</div>
                <div class="logo-text">Vibe<span>Finance</span></div>
            </div>
            <div class="header-actions">
                <div class="refresh-btn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2>Добро пожаловать в VibeFinance</h2>
                    <p>Ваш финансовый помощник на базе искусственного интеллекта поможет вам эффективнее управлять своими финансами, принимать более обоснованные финансовые решения и достигать финансовых целей.</p>
                    <div class="features">
                        <div class="feature">
                            <i class="fas fa-chart-line"></i>
                            <span>Бюджет</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-piggy-bank"></i>
                            <span>Сохраненные цели</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-lightbulb"></i>
                            <span>Умные советы</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea
                    class="message-input"
                    id="messageInput"
                    placeholder="Сохраните сюда свои траты..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const refreshBtn = document.getElementById('refreshBtn');

            // Auto-resize textarea
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Send message function
            function sendMessage() {
                const message = messageInput.value.trim();
                if (message) {
                    // Add user message to chat
                    addMessage(message, 'user');
                    messageInput.value = '';
                    messageInput.style.height = 'auto';

                    // Send message to Flask backend
                    fetch('/send_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Message sent successfully:', data);
                    })
                    .catch(error => {
                        console.error('Error sending message:', error);
                        addMessage("Извините, произошла ошибка при отправке сообщения.", 'ai');
                    });
                }
            }

            // Add message to chat
            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;

                const messageHeader = document.createElement('div');
                messageHeader.className = 'message-header';
                messageHeader.innerHTML = sender === 'user' ?
                    '<i class="fas fa-user"></i> Вы' :
                    '<i class="fas fa-robot"></i> VibeFinance AI';

                const messageContent = document.createElement('div');
                messageContent.textContent = text;

                messageDiv.appendChild(messageHeader);
                messageDiv.appendChild(messageContent);
                chatMessages.appendChild(messageDiv);

                // Scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Event listeners
            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            refreshBtn.addEventListener('click', function() {
                // Clear chat and show welcome message
                chatMessages.innerHTML = `
                    <div class="welcome-message">
                        <h2>Добро пожаловать в VibeFinance</h2>
                        <p>Ваш финансовый помощник на базе искусственного интеллекта поможет вам эффективнее управлять своими финансами, принимать более обоснованные финансовые решения и достигать финансовых целей.</p>
                        <div class="features">
                            <div class="feature">
                                <i class="fas fa-chart-line"></i>
                                <span>Бюджет</span>
                            </div>
                            <div class="feature">
                                <i class="fas fa-piggy-bank"></i>
                                <span>Сохраненные цели</span>
                            </div>
                            <div class="feature">
                                <i class="fas fa-lightbulb"></i>
                                <span>Умные советы</span>
                            </div>
                        </div>
                    </div>
                `;
                messageInput.focus();
            });

            // Focus input on load
            messageInput.focus();
        });
    </script>
</body>
</html>
